name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/my-node-app || mkdir ~/my-node-app && cd ~/my-node-app
            git clone https://github.com/YOUR_USERNAME/YOUR_REPO.git . || git pull origin main
            npm install
            sudo pm2 restart all || sudo pm2 start app.js --name "web-app"
            sudo pm2 save
